name: divebridge
version: "0.1.11"
slug: divebridge
description: Import dive computer exports (Cressi DiveSync) into the SSI logbook and export UDDF
url: https://github.com/LustigePerson/divebridge
arch:
  - aarch64
  - amd64
  - armv7
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:diving-scuba
panel_title: divebridge
map:
  - type: share
    read_only: false
options:
  ssi_email: ""
  ssi_password: ""
  output_dir: /share/divebridge/uddf
  log_level: info
schema:
  ssi_email: email?
  ssi_password: password?
  output_dir: str?
  log_level: list(debug|info|warning|error)?
