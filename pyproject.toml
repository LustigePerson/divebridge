[project]
name = "divebridge"
version = "0.1.12"
description = "Bring dive computer exports (Cressi DiveSync) into the SSI logbook and UDDF – Home Assistant add-on"
readme = "README.md"
authors = [
    { name = "Benedikt Reiz" }
]
requires-python = ">=3.12"
license = "MIT"
keywords = ["diving", "ssi", "uddf", "cressi", "home-assistant"]
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
divebridge = "divebridge:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning:openpyxl"]
